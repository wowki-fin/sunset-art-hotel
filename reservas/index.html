<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Room — Sunset Art Hotel</title>
<meta name="description" content="Book your stay at Sunset Art Hotel. Boutique hotel on the Black Sea beachfront, Chernomorets, Bulgaria.">
<link rel="canonical" href="https://sunset-art-hotel.vercel.app/reservas/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://sunset-art-hotel.vercel.app/reservas/">
<meta property="og:title" content="Book a Room — Sunset Art Hotel">
<meta property="og:description" content="Book your stay at Sunset Art Hotel. Boutique hotel on the Black Sea beachfront, Chernomorets, Bulgaria.">
<meta property="og:site_name" content="Sunset Art Hotel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2744;
    --gold: #b8922a;
    --neon: #ff3fa4;
    --white: #f9f7f4;
    --grey: #7a7570;
    --cream: #f2ede6;
    --text: #1c1a18;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--cream); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 300; min-height: 100vh; display: flex; flex-direction: column; }

  /* LANG SWITCHER */
  #lang-switcher {
    position: fixed; top: 1rem; right: 1.8rem; z-index: 9999;
    display: flex; align-items: center; gap: 0;
  }
  .lang-btn {
    background: transparent; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer; padding: 0.3rem 0.5rem; transition: color 0.2s;
    color: #444440; font-weight: 700; text-decoration: none;
  }
  .lang-btn:hover { color: var(--neon); }
  .lang-sep { font-size: 0.5rem; color: #999; pointer-events: none; }

  /* NAV */
  nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 3rem;
    background: rgba(242,237,230,0.97);
    backdrop-filter: blur(12px);
    border-bottom: 2px solid var(--neon);
    box-shadow: 0 2px 16px rgba(255,63,164,0.2);
  }
  .nav-logo img { height: 64px; }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a {
    color: var(--text); text-decoration: none; font-size: 0.72rem;
    letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.6; transition: opacity 0.2s;
  }
  .nav-links a:hover { opacity: 1; }
  .nav-back {
    background: transparent; border: 1px solid var(--neon); color: var(--neon);
    font-family: 'DM Sans', sans-serif; font-size: 0.72rem; letter-spacing: 0.18em;
    text-transform: uppercase; padding: 0.6rem 1.4rem; cursor: pointer;
    transition: all 0.25s; text-decoration: none; margin-right: 6rem;
  }
  .nav-back:hover { background: var(--neon); color: var(--white); }

  /* PAGE HEADER */
  .page-header {
    background: #2a3f6e;
    padding: 5rem 3rem 4rem;
    text-align: center;
  }
  .page-header .label {
    font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 1rem;
    text-shadow: 0 0 14px rgba(255,255,255,0.4);
  }
  .page-header h1 {
    font-family: 'Bebas Neue', sans-serif; font-size: clamp(3rem, 7vw, 6rem);
    color: #ffffff; letter-spacing: 0.04em; line-height: 1; margin-bottom: 0.8rem;
  }
  .page-header p {
    font-family: 'Cormorant Garamond', serif; font-size: 1.1rem;
    font-style: italic; color: rgba(255,255,255,0.7);
  }

  /* WIDGET AREA */
  .widget-section {
    flex: 1;
    padding: 4rem 3rem;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
  }
  .widget-wrapper {
    border: 1px solid rgba(28,26,24,0.12);
    background: #ffffff;
    padding: 2rem;
  }

  /* FOOTER */
  footer {
    background: var(--navy); padding: 2.5rem 3rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  footer img { height: 34px; filter: brightness(0) invert(1); opacity: 0.6; }
  footer p { font-size: 0.65rem; letter-spacing: 0.1em; color: rgba(249,247,244,0.25); }
  .footer-links { display: flex; gap: 2rem; list-style: none; }
  .footer-links a {
    font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase;
    color: rgba(249,247,244,0.4); text-decoration: none; transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--neon); }

  /* MOBILE */
  @media (max-width: 768px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    .nav-back { margin-right: 0; }
    .page-header { padding: 4rem 1.5rem 3rem; }
    .widget-section { padding: 2rem 1.5rem; }
    footer { flex-direction: column; gap: 1.5rem; text-align: center; }
    #lang-switcher { right: 1rem; }
  }
</style>
</head>
<body>

<!-- LANG SWITCHER -->
<div id="lang-switcher">

  <span class="lang-sep">|</span>

  <ul class="nav-links">
    <li><a href="../en/#about">About</a></li>
    <li><a href="../en/#rooms">Rooms</a></li>
    <li><a href="../en/#sayulita">Sayulita</a></li>
    <li><a href="../en/#gallery">Gallery</a></li>
    <li><a href="../en/#contact">Contact</a></li>
  </ul>
  <a class="nav-back" href="../en/">← Back</a>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <p class="label">Sunset Art Hotel · Chernomorets</p>
  <h1>Book a Room</h1>
  <p>Select your dates and find your perfect stay</p>
</div>

<!-- OCTORATE WIDGET -->
<div class="widget-section">

  </div>
</div>

<!-- FOOTER -->
<footer>
  <img src="https://static.wixstatic.com/media/3008e1_dc36e3cf587a4acb8ce00822c22760ff~mv2.png" alt="Sunset Art Hotel">
  <ul class="footer-links">
    <li><a href="../en/#about">About</a></li>
    <li><a href="../en/#rooms">Rooms</a></li>
    <li><a href="../en/#contact">Contact</a></li>
  </ul>
  <p>© 2026 Sunset Art Hotel · Chernomorets</p>
</footer>

</body>
</html>
